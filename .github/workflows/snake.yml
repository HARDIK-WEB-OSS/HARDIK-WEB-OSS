name: generate racetrack contribution graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: platane/snk@v3
        id: racetrack
        with:
          github_user_name: HARDIK-WEB-OSS
          outputs: |
            assets/racetrack-dark.svg?palette=github-dark&color_snake=%23FF2800&color_dots=15151e,1c1c26,2a2a35,3d3d4a,FF2800

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🏁 update racetrack graph"
          file_pattern: assets/racetrack-dark.svg