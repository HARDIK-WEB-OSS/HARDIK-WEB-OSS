<svg width="720" height="150" viewBox="0 0 720 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital@1&amp;display=swap');
      .stmt { font-family: 'JetBrains Mono', 'Consolas', monospace; font-style: italic; }
    </style>
    <linearGradient id="stmtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15151E"/>
      <stop offset="100%" stop-color="#1c1c26"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="720" height="150" rx="10" fill="url(#stmtBg)"/>
  <rect x="0" y="0" width="6" height="150" rx="3" fill="#FF2800"/>

  <text x="34" y="42" class="stmt" font-size="14" fill="#c7c7d1">
    "I engineer systems the way race teams engineer cars — every
  </text>
  <text x="34" y="66" class="stmt" font-size="14" fill="#c7c7d1">
    part earns its place under pressure. My track record: reconciliation
  </text>
  <text x="34" y="90" class="stmt" font-size="14" fill="#c7c7d1">
    engines that catch every discrepancy, regulatory pipelines that
  </text>
  <text x="34" y="114" class="stmt" font-size="14" fill="#c7c7d1">
    survive audits, and ML models tuned for the metric that actually
  </text>
  <text x="34" y="132" class="stmt" font-size="14" fill="#c7c7d1">
    matters, not the one that looks good on paper."
  </text>
</svg>